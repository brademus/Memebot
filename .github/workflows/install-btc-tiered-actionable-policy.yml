name: Install BTC tiered actionable policy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Run BTC tiered actionable policy installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/btc-tiered-actionable-policy
          fetch-depth: 0

      - name: Apply tiered actionable policy
        run: python3 tools/install-btc-tiered-actionable-policy.py

      - name: Verify focused BTC policy contracts
        run: |
          npm ci
          npm run build
          node --test dist/btc/platform/platform.test.js
          node --test dist/btc/platform/research-risk.test.js
          node --test dist/btc/platform/directional-stop.test.js
          node --check public/btc-dashboard.js

      - name: Commit source changes
        run: |
          rm tools/install-btc-tiered-actionable-policy.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/btc/platform/types.ts src/btc/platform/risk.ts src/btc/platform/research-risk.ts src/btc/platform/engine.ts src/btc/platform/execution.ts src/btc/platform/alerts.ts src/btc/platform/ledger.ts src/btc/platform/platform.test.ts src/btc/platform/research-risk.test.ts public/btc-dashboard.js tools/install-btc-tiered-actionable-policy.py
          git commit -m 'Adopt tiered evidence-based BTC actionable policy'
          git push origin HEAD:feature/btc-tiered-actionable-policy
