name: Install BTC directional stop invariant

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Run BTC directional stop installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/btc-directional-stop-invariant
          fetch-depth: 0

      - name: Apply directional stop fix
        run: python3 tools/install-btc-directional-stop-fix.py

      - name: Verify focused invariant
        run: |
          npm ci
          npm run build
          node --test dist/btc/platform/directional-stop.test.js
          node --test dist/btc/platform/research-risk.test.js

      - name: Commit source changes
        run: |
          rm tools/install-btc-directional-stop-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/btc/platform/risk.ts src/btc/platform/research-risk.ts src/btc/platform/strategies.ts src/btc/platform/directional-stop.test.ts tools/install-btc-directional-stop-fix.py
          git commit -m 'Enforce directional BTC structural stops'
          git push origin HEAD:fix/btc-directional-stop-invariant
