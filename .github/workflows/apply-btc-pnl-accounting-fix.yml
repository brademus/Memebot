name: Apply BTC PnL accounting fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/btc-pnl-accounting'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memebot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/memebot_test
      NODE_ENV: test
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply accounting patch
        run: python tools/apply_btc_pnl_accounting_fix.py
      - name: Verify focused contracts
        run: |
          npm run build
          node --test dist/btc/platform/pnl.test.js
          node --test dist/btc/platform/platform.integration.test.js
          node --check public/btc-dashboard.js
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/btc/platform/execution.ts src/btc/platform/ledger.ts src/btc/platform/engine.ts src/btc/platform/types.ts src/btc/platform/pnl.test.ts src/btc/platform/platform.integration.test.ts public/btc-dashboard.js public/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Correct BTC PnL accounting and book totals"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
