name: Fix Wave 2 tiered policy test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run Wave 2 tiered policy test fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/btc-tiered-actionable-policy
          fetch-depth: 0

      - name: Apply Wave 2 compatibility fix
        run: python3 tools/fix-wave2-tiered-policy-test.py

      - name: Verify Wave 2 and policy contracts
        run: |
          npm ci
          npm run build
          node --test dist/btc/platform/wave2-strategies.test.js
          node --test dist/btc/platform/platform.test.js
          node --test dist/btc/platform/research-risk.test.js

      - name: Commit test correction
        run: |
          rm tools/fix-wave2-tiered-policy-test.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/btc/platform/wave2-strategies.test.ts tools/fix-wave2-tiered-policy-test.py
          git commit -m 'Validate Wave 2 strategies through research risk contract'
          git push origin HEAD:feature/btc-tiered-actionable-policy
