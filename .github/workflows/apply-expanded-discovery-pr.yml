name: Apply Expanded Discovery on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/expand-helius-pumpportal-discovery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expand-helius-pumpportal-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse and execute the audited patch body
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/apply-expanded-discovery.yml').read_text()
          body = workflow.split("      - name: Expand quality-first discovery capacity\n        shell: python\n        run: |\n", 1)[1]
          body = body.split("      - name: Verify source and tests\n", 1)[0]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(body, 'expanded-discovery-patch', 'exec'))
      - name: Verify source and tests
        run: npm run check
      - name: Commit source-only result
        shell: bash
        run: |
          rm .github/workflows/apply-expanded-discovery.yml
          rm .github/workflows/apply-expanded-discovery-pr.yml
          rm -f scripts/apply-expanded-discovery.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Expand quality-first Helius and PumpPortal discovery capacity"
          git push origin HEAD:feature/expand-helius-pumpportal-discovery
