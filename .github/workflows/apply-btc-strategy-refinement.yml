name: Apply BTC strategy refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refine/btc-strategy-phase1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply refinement
        run: |
          python3 scripts/apply_btc_strategy_refinement.py
          python3 scripts/finalize_btc_strategy_refinement.py
      - name: Verify focused contracts
        run: |
          npm run build
          node --test dist/btc/platform/research-risk.test.js dist/btc/platform/wave2-strategies.test.js dist/btc/platform/strategy-refinement.test.js
          node --check public/btc-dashboard.js
      - name: Commit generated refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/btc/platform public/btc-dashboard.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refine failing BTC research strategies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
