name: One-Time Expanded Discovery Implementation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expand-helius-pumpportal-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply quality-first capacity patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/apply-expanded-discovery.yml').read_text()
          body = workflow.split("      - name: Expand quality-first discovery capacity\n        shell: python\n        run: |\n", 1)[1]
          body = body.split("      - name: Verify source and tests\n", 1)[0]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(body, 'expanded-discovery-patch', 'exec'))

          index = Path('src/index.ts')
          text = index.read_text()
          old = """    const sourceBonus = token.source === 'wallet' ? 500
      : token.source === 'social' ? 300
        : token.source === 'momentum' ? 250 : 0;"""
          new = """    const sourceBonus = token.source === 'wallet' ? 500
      : token.source === 'momentum' ? 250
        : token.source === 'aged' ? 150 : 0;"""
          assert old in text
          index.write_text(text.replace(old, new, 1))
      - name: Verify
        run: npm run check
      - name: Commit source-only branch
        shell: bash
        run: |
          rm .github/workflows/apply-expanded-discovery.yml
          rm .github/workflows/apply-expanded-discovery-pr.yml
          rm -f scripts/apply-expanded-discovery.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Expand quality-first Helius and PumpPortal discovery capacity"
          git push origin HEAD:feature/expand-helius-pumpportal-discovery
