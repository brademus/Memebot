name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee typescript-build.log

      - name: Retain TypeScript build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-build-${{ github.run_id }}
          path: typescript-build.log
          retention-days: 7

      - name: Retain compiled application
        uses: actions/upload-artifact@v4
        with:
          name: compiled-dist-${{ github.run_id }}
          path: dist
          retention-days: 2

      - name: Jupiter built and simulated entry and exit tests
        run: node --test dist/paper/execution.test.js

      - name: Pump.fun measured-fill parser tests
        run: node --test dist/paper/curve-execution-measurement.test.js

      - name: Evidence policy and paired-shadow tests
        run: node --test dist/evidence/system-v3.test.js

      - name: Jupiter quote classification tests
        run: node --test dist/paper/quote-status.test.js

      - name: Paper persistence health tests
        run: node --test dist/paper/persistence-health.test.js

      - name: Paper tracking recovery tests
        run: node --test dist/paper/tracking-recovery.test.js

      - name: Telegram delivery retry tests
        run: node --test dist/alerts/telegram.test.js

      - name: Private admin authentication tests
        run: node --test dist/api/security.test.js

      - name: Best Buy lane tests
        run: node --test dist/api/bestbuys.test.js

      - name: Scoring calibration parity tests
        run: node --test dist/scoring/score.test.js

      - name: State-machine and abstention tests
        run: node --test dist/scoring/states.test.js

      - name: BTC regime and retest strategy tests
        run: node --test dist/btc/strategy.test.js

      - name: BTC multistrategy leverage and registry tests
        run: node --test dist/btc/platform/platform.test.js

      - name: BTC Wave 2 shadow strategy tests
        run: node --test dist/btc/platform/wave2-strategies.test.js

      - name: BTC cross-asset lead state tests
        run: node --test dist/btc/platform/cross-asset.test.js

      - name: Exact forward snapshot tests
        run: node --test dist/tuning/snapshots.test.js

      - name: Competing-risk monotonicity test
        run: node --test --test-name-pattern="high-quality" dist/model/model.test.js

      - name: Funding-entity graph test
        run: node --test --test-name-pattern="shared funding" dist/model/model.test.js

      - name: Event-time burst quality test
        run: node --test --test-name-pattern="event-time" dist/model/model.test.js

      - name: Regime classification test
        run: node --test --test-name-pattern="regime classifier" dist/model/model.test.js

      - name: Observation milestone test
        run: node --test --test-name-pattern="observations include" dist/model/model.test.js

      - name: Vercel API proxy path regression tests
        run: node --test tests/vercel-proxy-path.test.js

      - name: Full test manifest
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log

      - name: Retain full test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-${{ github.run_id }}
          path: full-test.log
          retention-days: 7

      - name: Dashboard JavaScript syntax
        run: node --check public/app.js && node --check public/market-mode.js && node --check public/btc-dashboard.js && node --check public/no-admin.js && node --check public/daily-review.js && node --check public/observed-wins.js

  postgres-persistence:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memebot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memebot_test
      NODE_ENV: test
      SIMULATION_WALLET: 11111111111111111111111111111111
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download tested application build
        uses: actions/download-artifact@v4
        with:
          name: compiled-dist-${{ github.run_id }}
          path: dist

      - name: Real Postgres paper persistence contract
        run: node --test dist/paper/persistence.integration.test.js

      - name: BTC Postgres safety contract
        run: node --test dist/btc/persistence.integration.test.js

      - name: BTC multistrategy Postgres contract
        run: node --test dist/btc/platform/platform.integration.test.js

      - name: Evidence policy and append-only journal contract
        run: node --test dist/evidence/system-v3.integration.test.js
