name: Fix BTC Research Fill Guard

on:
  pull_request:
    branches: [main]
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/btc-profitability-diagnostics-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/btc-profitability-diagnostics-20260731
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Correct active-versus-armed research semantics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'src/btc/platform/engine.ts';
          let source = fs.readFileSync(path, 'utf8');
          const anchor = `    return active || armed;
            }

            private strategyCooldownActive`;
          const insertion = `    return active || armed;
            }

            private strategyHasActiveResearch(strategyId: string): boolean {
              return this.activeCalls.some(call => call.book === 'research'
                && call.strategyId === strategyId && activeStates.has(call.status));
            }

            private strategyCooldownActive`;
          if (!source.includes(anchor)) throw new Error('research exposure insertion anchor is missing');
          source = source.replace(anchor, insertion);
          const oldFillGuard = `if (armed.book === 'research' && this.strategyHasResearchExposure(armed.candidate.strategyId))`;
          if (!source.includes(oldFillGuard)) throw new Error('fill-time research guard target is missing');
          source = source.replace(oldFillGuard,
            `if (armed.book === 'research' && this.strategyHasActiveResearch(armed.candidate.strategyId))`);
          fs.writeFileSync(path, source);
          NODE
          cat > src/btc/platform/engine-research.test.ts <<'TEST'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { BtcMultiStrategyEngine } from './engine';

          test('armed research blocks duplicate admission without masquerading as an active filled call', () => {
            const engine = new BtcMultiStrategyEngine() as any;
            engine.armed.set('research:candidate-1', {
              book: 'research',
              candidate: { strategyId: 'strategy-1', direction: 'long' },
            });

            assert.equal(engine.strategyHasResearchExposure('strategy-1'), true);
            assert.equal(engine.strategyHasActiveResearch('strategy-1'), false);

            engine.activeCalls = [{
              book: 'research',
              strategyId: 'strategy-1',
              status: 'open',
            }];
            assert.equal(engine.strategyHasActiveResearch('strategy-1'), true);
          });
          TEST
          sed -i 's/^          //' src/btc/platform/engine-research.test.ts
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-btc-research-fill-guard.yml
      - name: Install dependencies
        run: npm ci
      - name: Compile and run unit tests
        run: npm run check
      - name: Commit correction
        run: |
          git config user.name "Memebot Builder"
          git config user.email "actions@github.com"
          git add src/btc/platform/engine.ts src/btc/platform/engine-research.test.ts .github/workflows/fix-btc-research-fill-guard.yml
          git commit -m "Fix BTC research fill guard"
          git push origin HEAD:fix/btc-profitability-diagnostics-20260731
