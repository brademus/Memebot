name: Finalize Wave 1 Integration

on:
  push:
    branches:
      - feature/btc-wave1-24-7-strategies

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/btc-wave1-24-7-strategies
          fetch-depth: 0

      - name: Integrate Wave 1 registry and CI
        shell: python
        run: |
          from pathlib import Path

          engine = Path('src/btc/platform/engine.ts')
          text = engine.read_text()
          old_import = "import { BTC_STRATEGIES } from './strategies';"
          assert old_import in text
          text = text.replace(old_import, "import { BTC_STRATEGIES } from './strategy-registry';", 1)
          old_cooldown = """    const cooldownMinutes = candidate.strategyId === 'btc-cross-venue-lag' ? 5
              : candidate.strategyId === 'btc-orderflow-absorption' ? 10 : 30;"""
          new_cooldown = """    const cooldownByStrategy: Record<string, number> = {
              'btc-cross-venue-lag': 5,
              'btc-orderflow-absorption': 10,
              'btc-adaptive-trend-rider': 120,
              'btc-donchian-trend-breakout': 60,
              'btc-funding-crowding-reversal': 120,
              'btc-perp-premium-convergence': 45,
              'btc-price-oi-state': 45,
            };
            const cooldownMinutes = cooldownByStrategy[candidate.strategyId] ?? 30;"""
          assert old_cooldown in text
          engine.write_text(text.replace(old_cooldown, new_cooldown, 1))

          platform_test = Path('src/btc/platform/platform.test.ts')
          text = platform_test.read_text()
          text = text.replace("from './strategies';", "from './strategy-registry';", 1)
          text = text.replace('BTC strategy registry contains seven unique versioned strategies', 'BTC strategy registry contains twelve unique versioned strategies', 1)
          text = text.replace('assert.equal(BTC_STRATEGIES.length, 7);', 'assert.equal(BTC_STRATEGIES.length, 12);', 1)
          text = text.replace('assert.equal(new Set(BTC_STRATEGIES.map(strategy => strategy.id)).size, 7);', 'assert.equal(new Set(BTC_STRATEGIES.map(strategy => strategy.id)).size, 12);', 1)
          platform_test.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          marker = """      - name: BTC multistrategy leverage and registry tests
                run: node --test dist/btc/platform/platform.test.js
          """
          addition = marker + """
                - name: BTC Wave 1 round-the-clock strategy tests
                  run: node --test dist/btc/platform/wave1-strategies.test.js
          """
          assert marker in text
          ci.write_text(text.replace(marker, addition, 1))

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/export-wave1-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/btc/platform/engine.ts src/btc/platform/platform.test.ts .github/workflows/ci.yml
          git commit -m "Integrate Wave 1 strategies into BTC engine"
          git push origin HEAD:feature/btc-wave1-24-7-strategies
