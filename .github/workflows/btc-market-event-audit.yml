name: BTC Market Event Audit

on:
  push:
    branches:
      - research/btc-market-event-audit
    paths:
      - scripts/btc-market-event-audit*.mjs
      - .github/workflows/btc-market-event-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/btc-market-event-audit*.mjs
      - .github/workflows/btc-market-event-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare live BTC trades with Coinbase market path
        run: node scripts/btc-market-event-audit-coinbase.mjs
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-market-event-audit
          path: artifacts/btc-market-audit.*
          if-no-files-found: error
          retention-days: 14
