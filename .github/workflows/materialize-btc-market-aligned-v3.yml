name: Materialize BTC Market-Aligned V3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-btc-market-aligned-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: refine/btc-market-aligned-v3-clean
          fetch-depth: 0
      - name: Apply source-only redesign commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick e0b8c9c2c8cb479d74ad53445bdab6bad49d0942
          git rm .github/workflows/materialize-btc-market-aligned-v3.yml
          git commit -m "Remove one-time BTC materialization workflow"
          git push origin HEAD:refine/btc-market-aligned-v3-clean
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Focused BTC contracts
        run: |
          node --test dist/btc/platform/research-risk.test.js
          node --test dist/btc/platform/strategy-refinement.test.js
          node --test dist/btc/platform/wave1-strategies.test.js
          node --test dist/btc/platform/wave2-strategies.test.js
