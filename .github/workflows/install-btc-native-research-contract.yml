name: Install BTC native research contract

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Run BTC native research installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/btc-native-research-contract
          fetch-depth: 0

      - name: Apply research contract split
        run: python3 tools/install-btc-native-research-contract.py

      - name: Verify focused contract
        run: |
          npm ci
          npm run build
          node --test dist/btc/platform/research-risk.test.js

      - name: Commit source changes
        run: |
          rm tools/install-btc-native-research-contract.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/btc/platform/engine.ts public/btc-dashboard.js tools/install-btc-native-research-contract.py
          git commit -m 'Separate BTC research and actionable risk contracts'
          git push origin HEAD:feature/btc-native-research-contract
