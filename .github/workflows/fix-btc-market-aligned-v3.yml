name: Fix BTC Market-Aligned V3 Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-btc-market-aligned-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: refine/btc-market-aligned-v3-clean
          fetch-depth: 0
      - name: Correct candidate decision state and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/btc/platform/engine.ts')
          text = path.read_text()
          old = "markCandidateDecision(armed.candidate.id, 'cancelled', 'actual executable fill failed risk revalidation')"
          new = "markCandidateDecision(armed.candidate.id, 'missed', 'actual executable fill failed risk revalidation')"
          if text.count(old) != 1:
              raise SystemExit(f'expected one candidate state match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-btc-market-aligned-v3.yml
          git add src/btc/platform/engine.ts
          git commit -m "Fix fill revalidation candidate state"
          git push origin HEAD:refine/btc-market-aligned-v3-clean
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Focused BTC contracts
        run: |
          node --test dist/btc/platform/research-risk.test.js
          node --test dist/btc/platform/strategy-refinement.test.js
          node --test dist/btc/platform/wave1-strategies.test.js
          node --test dist/btc/platform/wave2-strategies.test.js
