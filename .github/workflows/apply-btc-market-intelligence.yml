name: Apply BTC Market Intelligence

on:
  push:
    branches: [feature/btc-market-intelligence-feeds]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/btc-market-intelligence-feeds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate collectors into BTC runtime
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('src/btc/runtime.ts')
          text = runtime.read_text()
          import_anchor = "import { buildCrossAssetState, TimedPrice } from './platform/cross-asset';\n"
          import_line = "import { enrichBtcMarketContext, startBtcMarketIntelligence } from './market-intelligence';\n"
          assert import_anchor in text
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line)

          old = "  return { ...base, regime: classifyRegime(base) };"
          new = "  const enriched = enrichBtcMarketContext(base);\n  return { ...enriched, regime: classifyRegime(enriched) };"
          assert old in text
          text = text.replace(old, new)

          old = "  connectBybit();\n  connectCoinbase();"
          new = "  connectBybit();\n  connectCoinbase();\n  startBtcMarketIntelligence();"
          assert old in text
          text = text.replace(old, new)
          runtime.write_text(text)

          types = Path('src/btc/platform/types.ts')
          text = types.read_text()
          old = "  basisBps: number;\n}"
          new = "  basisBps: number;\n  marketIntelligence?: Record<string, unknown>;\n}"
          assert old in text
          text = text.replace(old, new, 1)
          old = "  sellAbsorptionScore?: number;\n  bids: BookLevel[];"
          new = "  sellAbsorptionScore?: number;\n  coinbaseDepthImbalance5Bps?: number | null;\n  krakenDepthImbalance5Bps?: number | null;\n  consolidatedSpotDepthImbalance5Bps?: number | null;\n  coinbaseTradeDeltaUsd10s?: number;\n  krakenTradeDeltaUsd10s?: number;\n  bids: BookLevel[];"
          assert old in text
          text = text.replace(old, new, 1)
          types.write_text(text)
      - name: Add deterministic feature tests
        shell: bash
        run: |
          cat > src/btc/market-intelligence.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { enrichBtcMarketContext, getBtcMarketIntelligence } from './market-intelligence';

          test('market intelligence snapshot is safe before public sockets warm', () => {
            const snapshot = getBtcMarketIntelligence(100_000, 1_000_000);
            assert.equal(typeof snapshot.healthy, 'boolean');
            assert.ok(Array.isArray(snapshot.blockers));
            assert.equal(snapshot.optionContractsObserved, 0);
          });

          test('market context enrichment is additive and never changes prices or core risk inputs', () => {
            const context: any = {
              timestamp: 1_000_000,
              prices: { last: 100_000, bid: 99_999, ask: 100_001, mark: 100_000, index: 100_000, coinbaseSpot: 100_000, krakenSpot: 100_000, consolidatedFair: 100_000 },
              candles: { oneMinute: [], fiveMinute: [], fifteenMinute: [], oneHour: [], fourHour: [] },
              derivatives: { fundingRate: 0, predictedFundingRate: 0, nextFundingAt: null, openInterest: 1, openInterestValue: 1, openInterestChangePct: 0, longLiquidationUsd5m: 0, shortLiquidationUsd5m: 0, basisBps: 0 },
              orderFlow: { aggressiveBuyUsd1m: 0, aggressiveSellUsd1m: 0, aggressiveBuyUsd5m: 0, aggressiveSellUsd5m: 0, topBookImbalance: 0, depthImbalance5Bps: 0, bookFragility: 0, absorptionScore: 0, bids: [], asks: [] },
              feed: { healthy: true },
            };
            const enriched: any = enrichBtcMarketContext(context);
            assert.equal(enriched.prices.mark, context.prices.mark);
            assert.equal(enriched.derivatives.fundingRate, context.derivatives.fundingRate);
            assert.ok(enriched.derivatives.marketIntelligence);
            assert.equal(typeof enriched.orderFlow.coinbaseTradeDeltaUsd10s, 'number');
          });
          EOF
      - name: Verify
        run: npm run check
      - name: Commit source-only result
        shell: bash
        run: |
          rm .github/workflows/apply-btc-market-intelligence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/btc/runtime.ts src/btc/platform/types.ts src/btc/market-intelligence.ts src/btc/market-intelligence.test.ts .github/workflows/apply-btc-market-intelligence.yml
          git commit -m "Integrate public BTC options and multi-venue L2 research feeds"
          git push origin HEAD:feature/btc-market-intelligence-feeds
