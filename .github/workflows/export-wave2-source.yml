name: Apply Wave 2 Source

on:
  push:
    branches:
      - feature/btc-wave2-shadow-strategies

permissions:
  contents: write

jobs:
  apply-wave2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/btc-wave2-shadow-strategies
          fetch-depth: 0
      - name: Apply Wave 2 implementation
        env:
          WAVE2_PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$WAVE2_PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/wave2.patch
          echo "7240081edb07523d14903759e5bc4ac6916d61741371a0d9ece84f00a080296f  /tmp/wave2.patch" | sha256sum --check
          git apply --index /tmp/wave2.patch
          git rm .github/workflows/export-wave2-source.yml
          git config user.name "Memebot Wave 2"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Add Wave 2 BTC shadow strategies"
          git push origin HEAD:feature/btc-wave2-shadow-strategies
