name: Export Wave 2 Source

on:
  push:
    branches:
      - feature/btc-wave2-shadow-strategies
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record base tree
        run: git rev-parse 'HEAD^{tree}' > tree-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-source-${{ github.run_id }}
          path: |
            src
            public
            package.json
            package-lock.json
            tsconfig.json
            schema-btc.sql
            .github/workflows/ci.yml
            tree-sha.txt
          retention-days: 1
