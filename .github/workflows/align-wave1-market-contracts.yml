name: Align Wave 1 Market Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/align-wave1-market-contracts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: refine/btc-market-aligned-v3-clean
          fetch-depth: 0
      - name: Align Wave 1 fixtures and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/btc/platform/wave1-strategies.test.ts')
          text = path.read_text()

          old = "assert.ok(research.rejectionReasons.some(reason => reason.includes('quality floor')));"
          new = "assert.ok(research.rejectionReasons.some(reason => reason.includes('quality floor') || reason.includes('friction')));"
          if text.count(old) != 1:
              raise SystemExit(f'expected one quarantine assertion, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_adaptive = """test('adaptive trend rider emits a valid research candidate that is filtered when this setup misses the standard tier', () => {
  resetWave1StrategyStateForTests();
  const context = baseContext();
  const prior = context.candles.fifteenMinute.at(-2)!;
  prior.open = 99_760;
  prior.close = 99_700;
  prior.high = 99_850;
  prior.low = 99_600;
  const latest = context.candles.fifteenMinute.at(-1)!;
  latest.open = 99_650;
  latest.close = 99_900;
  latest.high = 100_100;
  latest.low = 99_500;
  context.prices = { ...context.prices, last: 99_900, bid: 99_899, ask: 99_901, mark: 99_900, index: 99_900, consolidatedFair: 99_900 };
  const candidates = strategy('btc-adaptive-trend-rider').evaluate(context);
  assert.equal(candidates.length, 1);
  assertResearchOnlyAtThisSetup(context, candidates[0]!);
  assert.equal(candidates[0].direction, 'long');
  assert.equal(candidates[0].setupType, 'adaptive_trend_pullback');
});"""
          new_adaptive = """test('adaptive trend rider emits after a deep pullback, completed reclaim and fresh stop trigger', () => {
  resetWave1StrategyStateForTests();
  const context = baseContext();
  const series = context.candles.fifteenMinute;
  const start = series.length - 12;
  for (let index = start; index < series.length; index++) {
    const offset = index - start;
    const candle = series[index]!;
    candle.open = 99_650 + offset * 20;
    candle.close = candle.open + 8;
    candle.high = candle.open + 45;
    candle.low = candle.open - 45;
    candle.volume = 200;
    candle.buyVolume = 120;
    candle.sellVolume = 80;
  }
  const swing = series.at(-6)!;
  swing.open = 99_720;
  swing.close = 99_730;
  swing.high = 99_770;
  swing.low = 99_350;
  const prior = series.at(-2)!;
  prior.open = 99_900;
  prior.close = 99_820;
  prior.high = 99_940;
  prior.low = 99_790;
  const latest = series.at(-1)!;
  latest.open = 99_830;
  latest.close = 99_980;
  latest.high = 100_030;
  latest.low = 99_800;
  context.prices = { ...context.prices, last: 99_980, bid: 99_979, ask: 99_981, mark: 99_980, index: 99_980, consolidatedFair: 99_980 };
  const candidates = strategy('btc-adaptive-trend-rider').evaluate(context);
  assert.equal(candidates.length, 1);
  const research = solveResearchRiskPlan(context, candidates[0]!);
  assert.equal(research.approved, true, research.rejectionReasons.join('; '));
  const plan = actionablePlan(context, candidates[0]!);
  assert.equal(plan.approved, true, plan.rejectionReasons.join('; '));
  assert.equal(candidates[0].direction, 'long');
  assert.equal(candidates[0].setupType, 'deep_trend_pullback_reclaim');
  assert.equal(candidates[0].entryMethod, 'stop');
});"""
          if text.count(old_adaptive) != 1:
              raise SystemExit(f'expected one adaptive fixture block, found {text.count(old_adaptive)}')
          text = text.replace(old_adaptive, new_adaptive, 1)

          old_prices = """      mark: 101_000,
      last: 101_000,
      bid: 100_999,
      ask: 101_001,
      index: 100_000,
      consolidatedFair: 100_000,"""
          new_prices = """      mark: 101_600,
      last: 101_600,
      bid: 101_599,
      ask: 101_601,
      index: 100_000,
      consolidatedFair: 100_000,"""
          if text.count(old_prices) != 1:
              raise SystemExit(f'expected one premium price fixture, found {text.count(old_prices)}')
          text = text.replace(old_prices, new_prices, 1)

          old_latest = """  latest.open = 101_080;
  latest.close = 100_950;"""
          new_latest = """  latest.open = 101_680;
  latest.close = 101_550;"""
          if text.count(old_latest) != 1:
              raise SystemExit(f'expected one premium confirmation fixture, found {text.count(old_latest)}')
          text = text.replace(old_latest, new_latest, 1)

          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-wave1-market-contracts.yml
          git add src/btc/platform/wave1-strategies.test.ts
          git commit -m "Align Wave 1 tests with friction-aware market structures"
          git push origin HEAD:refine/btc-market-aligned-v3-clean
      - name: Install dependencies
        run: npm ci
      - name: Build and test Wave 1
        run: |
          npm run build
          node --test dist/btc/platform/wave1-strategies.test.js
          node --test dist/btc/platform/strategy-refinement.test.js
